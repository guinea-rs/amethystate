[package]
name = "amethystate-guinea"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Lets a guinea timer's period follow a value held by an amethystate store"
keywords.workspace = true
categories.workspace = true
readme = "README.md"
rust-version = "1.95"

[dependencies]
amethystate.workspace = true
guinea = { version = "0.31", default-features = false }

[dev-dependencies]
amethystate = { workspace = true, features = ["test-utils", "redb"] }
guinea = { version = "0.31", default-features = false, features = ["test-utils"] }
futures.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time", "test-util"] }
