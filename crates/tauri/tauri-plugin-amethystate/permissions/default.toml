[default]
description = "Reads and writes the fields and maps the exported structs declare"
permissions = ["read", "write"]

[[set]]
identifier = "read"
description = "Reads the fields and maps the exported structs declare, and hears them change"
permissions = [
    "allow-amethystate-get",
    "allow-amethystate-get-prefix",
    "allow-amethystate-scan-keys",
    "allow-amethystate-subscribe",
    "allow-amethystate-unsubscribe"
]

[[set]]
identifier = "write"
description = "Writes and removes the values and map entries the exported structs declare, and saves them"
permissions = [
    "allow-amethystate-set",
    "allow-amethystate-delete",
    "allow-amethystate-delete-prefix",
    "allow-amethystate-flush"
]
