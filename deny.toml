[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2023-0126", reason = "im, a dev-dependency only two comparison benches use; OrdSet is not one of them" },
    { id = "RUSTSEC-2026-0248", reason = "im is unmaintained; a dev-dependency only two comparison benches use" },
    { id = "RUSTSEC-2026-0247", reason = "bitmaps is unmaintained; comes with im, a bench-only dev-dependency" },
    { id = "RUSTSEC-2026-0251", reason = "sized-chunks is unmaintained; comes with im, a bench-only dev-dependency" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = ["guinea-rs", "uniproc-dev"]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
exceptions = []

[licenses.private]
ignore = true
